name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Configurar Java correctamente para evitar el exit code 1 en Android
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --release --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: qhipu-apk
          path: build/app/outputs/flutter-apk/*.apk
